# Costruisce l'immagine Docker dell'app a ogni aggiornamento del ramo "main",
# la prova e la pubblica su GitHub Container Registry (ghcr.io).
name: Immagine Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nome dell'immagine
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sicurezza-casa" >> "$GITHUB_ENV"
          echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Il numero di versione è nel file VERSIONE (per esempio 1.0): si aumenta a ogni pull request,
      # +0.1 per le modifiche normali, +1 per quelle grandi. Una versione già pubblicata non si
      # sovrascrive mai: se il numero esiste già, la pull request non passa.
      - name: Versione
        run: |
          VER="$(tr -d ' \r\n' < VERSIONE)"
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::Il file VERSIONE deve contenere un numero come 1.0 (trovato: '$VER')"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY_OWNER,,}/sicurezza-casa:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          CODICE="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER,,}/sicurezza-casa/manifests/$VER")"
          # 404 = non ancora pubblicata; 401/403 = il pacchetto non esiste ancora (prima pubblicazione)
          if [ "$CODICE" = 404 ] || [ "$CODICE" = 401 ] || [ "$CODICE" = 403 ]; then echo "NUOVA=1" >> "$GITHUB_ENV"; echo "Versione $VER (non ancora pubblicata: va bene)"; exit 0; fi
          [ "$CODICE" = 200 ] || { echo "::error::Non riesco a sapere se la versione $VER esiste già (ghcr.io ha risposto $CODICE): riprova più tardi"; exit 1; }
          echo "NUOVA=0" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ github.actor }}" != 'dependabot[bot]' ]; then
            echo "::error::La versione $VER è già pubblicata: aumenta il numero nel file VERSIONE"; exit 1
          fi
          echo "::warning::La versione $VER è già pubblicata: questa volta non si pubblica niente"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Costruisci
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sicurezza-casa-test:latest
          build-args: |
            VERSIONE=${{ env.VER }}
            DATA_VERSIONE=${{ env.BUILT }}

      - name: Prove del server (dentro l'immagine)
        run: |
          docker run --rm --entrypoint node -v "$PWD/prove:/prove:ro" \
            sicurezza-casa-test:latest --test /prove/server.test.js

      - name: Prova rapida (l'app parte, risponde e resta chiusa a chi non è il proprietario)
        run: |
          docker run -d --name prova -e ASCOLTO=0.0.0.0 -e TS_PROPRIETARIO=prova@example.com -p 3000:3000 sicurezza-casa-test:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/salute >/dev/null 2>&1; then
              docker logs prova 2>&1 | grep -q "versione ${{ env.VER }}," || { docker logs prova; echo "Versione mancante"; exit 1; }
              # da fuori dal container pagina e dati restano chiusi anche con l'intestazione di Tailscale
              test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Tailscale-User-Login: prova@example.com' http://localhost:3000/)" = 403 || { echo "Pagina aperta da fuori"; exit 1; }
              test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Tailscale-User-Login: prova@example.com' http://localhost:3000/api/stato)" = 403 || { echo "Dati aperti da fuori"; exit 1; }
              # dentro il container (come fa Tailscale) il proprietario vede la pagina
              docker exec prova node -e "fetch('http://127.0.0.1:3000/',{headers:{'Tailscale-User-Login':'prova@example.com'}}).then(r=>{if(r.status!==200)throw new Error(r.status);console.log('Pagina OK')}).catch(e=>{console.error(e);process.exit(1)})" || { docker logs prova; exit 1; }
              echo "OK"; exit 0
            fi
            sleep 1
          done
          docker logs prova; exit 1

      # Le proposte di modifica (pull request) vengono solo provate, non pubblicate
      - name: Accedi a ghcr.io
        if: github.event_name != 'pull_request' && env.NUOVA == '1'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica
        if: github.event_name != 'pull_request' && env.NUOVA == '1'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSIONE=${{ env.VER }}
            DATA_VERSIONE=${{ env.BUILT }}
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:${{ env.VER }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Riepilogo
        if: github.event_name != 'pull_request' && env.NUOVA == '1'
        run: |
          echo "### Immagine pubblicata" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMG}:${VER}\` (anche \`:latest\`)" >> "$GITHUB_STEP_SUMMARY"
