# Propone ogni mese, con una pull request per tipo, gli aggiornamenti delle versioni fissate:
# immagini Docker del Dockerfile, GitHub Actions del workflow e librerie di app/package.json.
# Per immagini e librerie solo aggiornamenti minori e correzioni: i salti di versione principale
# (per esempio Node 22 → 26, Express 5 → 6) si fanno apposta, provandoli, non da Dependabot.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups: { immagini: { patterns: ["*"] } }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    groups: { librerie: { patterns: ["*"] } }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
