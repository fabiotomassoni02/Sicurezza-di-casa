<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina riservata</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f1ee; color: #0b0b0b;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #121211; color: #f0efec; } .scheda { background: #1a1a19 !important; border-color: #2e2e2b !important; } }
  .scheda { max-width: 420px; background: #fcfcfb; border: 1px solid #e3e3de; border-radius: 16px; padding: 28px; text-align: center; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { margin: 0; opacity: .75; }
  svg { width: 40px; height: 40px; stroke: #8a8983; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="scheda">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h1>Pagina riservata</h1>
    <p>Questa pagina si apre solo dall'account Tailscale del proprietario.</p>
  </div>
</body>
</html>
